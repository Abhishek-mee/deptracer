name: deptracer CI

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[windows]"
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  linux-integration:
    # Bubblewrap needs unprivileged user namespaces. Ubuntu 24.04 hosted runners
    # restrict them with AppArmor, so use the 22.04 image for the sandboxed E2E
    # test instead of weakening the runner's security policy with sudo sysctls.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update
      - run: sudo apt-get install -y bubblewrap strace patchelf gcc
      - run: python -m pip install -e ".[build]"
      - run: python -m unittest discover -s tests/integration -v
